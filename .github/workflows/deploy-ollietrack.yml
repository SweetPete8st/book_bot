name: Deploy OllieTrack to GitHub Pages

on:
  push:
    branches: [claude/mobile-app-deployment-rt1re8]
    paths:
      - "ollie-track/**"
      - ".github/workflows/deploy-ollietrack.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ollie-track
          force_orphan: true
